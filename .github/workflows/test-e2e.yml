name: E2E Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The Go the Dockerfile builds the image with, rather than go.mod's
      # minimum, so CI checks what ships.
      - name: Read the image's Go version
        id: go
        run: |
          version=$(hack/build-go-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}

      - name: Install kind
        # A pinned version, installed with go install so the Go checksum
        # database verifies it.
        run: |
          make kind
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e
