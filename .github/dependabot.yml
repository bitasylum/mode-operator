version: 2
updates:
  # mode-operator, the client library, and the library's integration tests.
  - package-ecosystem: gomod
    directories:
      - /
      - /client
      - /client/integration
    schedule:
      interval: weekly
    # Don't propose a release until it has been out a week. Security updates
    # aren't delayed.
    cooldown:
      default-days: 7
    # A k8s.io minor release comes out weeks before the controller-runtime
    # release that supports it, so take k8s.io minors only through
    # controller-runtime, whose minor updates bring them in.
    ignore:
      - dependency-name: "k8s.io/*"
        update-types: ["version-update:semver-minor"]
    # A dependency is updated in all three modules in one PR: the integration
    # tests use the library's go.mod through a replace, so they must move
    # together. The library has no controller-runtime, so its k8s.io minimum
    # only moves with the operator's.
    groups:
      kubernetes:
        group-by: dependency-name
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      go:
        group-by: dependency-name
        patterns:
          - "*"

  # The golang builder image and the distroless runtime image. Go patch
  # releases only: a new Go minor version is a change to make on purpose (see
  # the README's Development section). Go patch releases are mostly security
  # fixes, and Dependabot raises no security updates for images, so they skip
  # the cooldown.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude:
        - golang
    ignore:
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Major versions come as PRs of their own.
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
