# Full access to ClusterModeDefinitions, for the admins or the GitOps service
# account that manage the modes. Neither mode-operator nor the
# mode manager can write definitions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: mode-operator
    app.kubernetes.io/managed-by: kustomize
  name: clustermodedefinition-admin
rules:
- apiGroups:
  - mode.bitasylum.org
  resources:
  - clustermodedefinitions
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
  - deletecollection
