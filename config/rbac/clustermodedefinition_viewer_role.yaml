# This rule is not used by the project mode-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to mode.bitasylum.org resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: mode-operator
    app.kubernetes.io/managed-by: kustomize
  name: clustermodedefinition-viewer-role
rules:
- apiGroups:
  - mode.bitasylum.org
  resources:
  - clustermodedefinitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - mode.bitasylum.org
  resources:
  - clustermodedefinitions/status
  verbs:
  - get
