---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: controller
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - mode.bitasylum.org
  resources:
  - clustermodedefinitions
  - clustermodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - mode.bitasylum.org
  resources:
  - clustermodes/status
  verbs:
  - get
  - patch
  - update
