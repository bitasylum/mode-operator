---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - mode.bitasylum.org
  resources:
  - clustermodes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - mode.bitasylum.org
  resources:
  - clustermodes/finalizers
  verbs:
  - update
- apiGroups:
  - mode.bitasylum.org
  resources:
  - clustermodes/status
  verbs:
  - get
  - patch
  - update
