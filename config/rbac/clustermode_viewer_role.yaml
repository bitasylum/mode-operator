# Read-only access to ClusterModes and their status, for anyone who only
# needs to see the current mode.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: mode-operator
    app.kubernetes.io/managed-by: kustomize
  name: clustermode-viewer
rules:
- apiGroups:
  - mode.bitasylum.org
  resources:
  - clustermodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - mode.bitasylum.org
  resources:
  - clustermodes/status
  verbs:
  - get
