# What the mode manager needs on the CRDs. The mode manager's own
# install binds its ServiceAccount to this role and grants the rest.
#
# Every verb is limited to the ClusterModes named under resourceNames. Create
# is too: the mode manager creates its ClusterMode with server-side apply,
# which the API server authorizes as a create of that name, so a plain create
# is refused. To list or watch one of them, use a metadata.name field
# selector. There is no access to clustermodes/status, and definitions are
# read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: mode-operator
    app.kubernetes.io/managed-by: kustomize
  name: clustermode-writer
rules:
- apiGroups:
  - mode.bitasylum.org
  resources:
  - clustermodes
  resourceNames:
  - default
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - patch
- apiGroups:
  - mode.bitasylum.org
  resources:
  - clustermodedefinitions
  verbs:
  - get
  - list
  - watch
