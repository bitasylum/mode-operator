apiVersion: mode.bitasylum.org/v1alpha1
kind: ClusterModeDefinition
metadata:
  labels:
    app.kubernetes.io/name: mode-operator
    app.kubernetes.io/managed-by: kustomize
  name: standard
spec:
  modes: [normal, peak, offpeak, maintenance, standby]
  defaultMode: standby
  # Optional: make the modes a state machine. Each mode may then move only to
  # the modes listed for it, and only once it is Ready. Any mode may move to
  # defaultMode, a mode with no rule can only move to defaultMode, and
  # defaultMode must have a rule.
  # transitions:
  #   - from: normal
  #     to: [peak, offpeak]
  #   - from: peak
  #     to: [normal]
  #   - from: offpeak
  #     to: [normal]
  #   - from: standby
  #     to: [normal, maintenance]
