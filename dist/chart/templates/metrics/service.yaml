{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mode-operator.resourceName" (dict "suffix" "metrics" "context" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mode-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  ports:
    - name: https
      port: {{ .Values.metrics.port }}
      protocol: TCP
      targetPort: metrics
  selector:
    {{- include "mode-operator.selectorLabels" . | nindent 4 }}
{{- end }}
