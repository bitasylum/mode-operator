{{- if and .Values.networkPolicy.enabled .Values.metrics.enabled }}
# Only namespaces matching the selector may reach the metrics port. The
# controller accepts no other inbound traffic; the kubelet's health checks
# aren't affected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mode-operator.resourceName" (dict "suffix" "allow-metrics" "context" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mode-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mode-operator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.metricsNamespaceSelector | nindent 12 }}
      ports:
        - port: {{ .Values.metrics.port }}
          protocol: TCP
{{- end }}
